name: 数据源健康自检

# 只读探测全部已接入接口，不写数据库、不推飞书、不产生交易信号。
# 手动：Actions → 数据源健康自检 → Run workflow
# 自动：每周一北京时间 09:00（UTC 01:00）体检一次，结果写入 Run Summary。
# 准点由 Cloudflare Worker 触发；异常会推到独立告警机器人。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: true

env:
  # 告警凭据：composite action 里取不到 secrets，统一在 workflow env 注入一次
  ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
  ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}

jobs:
  check:
    runs-on: ubuntu-latest
    # 逐项探测多个外部接口；不设上限时 job 会吃掉默认的 360 分钟额度。
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: 逐项探测并生成报告
        run: |
          python check_sources.py --markdown --out sources-health.json >> "$GITHUB_STEP_SUMMARY"

      # 交易日历一旦拉不到，is_trading_day 会静默退回「排除周末」——节假日被当成
      # 交易日，节后回看算错。这个步骤存在的唯一意义，就是把那次静默降级变成一次
      # 可见的失败（并走下面已有的告警链路）。周检一次即可：日历按年更新。
      - name: 校验交易日历可用性
        run: |
          python -m pip install -q "akshare==1.20.42"
          python - <<'PY'
          import json
          import os
          import sys

          from utils.trade_date_utils import calendar_status

          status = calendar_status()
          print(json.dumps(status, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n### 交易日历\n\n")
              for key, value in status.items():
                  fh.write(f"- {key}: `{value}`\n")

          if not status["loaded"]:
              sys.exit("交易日历未能加载：is_trading_day 会退回「排除周末」，节假日将被误判为交易日")
          if not status["covers_today"]:
              sys.exit(
                  f"交易日历只覆盖到 {status['max_date']}，未含今天；"
                  "超出范围的日期会按「排除周末」判断，请确认数据源是否已发布新一年的日历"
              )
          print("交易日历校验通过")
          PY

      - name: 保存检查结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-health
          path: sources-health.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 失败告警
        if: failure()
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 数据源健康自检任务运行失败，请查看日志"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 数据源健康自检 job 被取消或超时（failure() 告警不会触发）"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
