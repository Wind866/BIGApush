name: 数据源健康自检

# 只读探测全部已接入接口，不写数据库、不推飞书、不产生交易信号。
# 手动：Actions → 数据源健康自检 → Run workflow
# 自动：每周一北京时间 09:00（UTC 01:00）体检一次，结果写入 Run Summary。
# 准点由 Cloudflare Worker 触发；异常会推到独立告警机器人。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 逐项探测并生成报告
        run: |
          python check_sources.py --markdown --out sources-health.json >> "$GITHUB_STEP_SUMMARY"

      - name: 保存检查结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-health
          path: sources-health.json
          retention-days: 30

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "::error::未配置独立告警 Secret ALERT_WEBHOOK；本次告警退回业务 webhook，业务 webhook 故障时告警会一并失效"
          fi
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "::error::未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 数据源健康自检任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || echo "::error::告警发送失败（独立告警通道可能也失效）"
