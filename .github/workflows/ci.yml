name: CI · 语法 / 单元 / 档期表

# 本仓库曾因 .gitignore 忽略 test_*.py 而长期零测试，
# utils/buy_signal_judger.py 的 f-string 语法错误也一直无人发现。
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 安装校验依赖
        run: python -m pip install -q "PyYAML>=6.0,<7"

      - name: Python 全仓库语法检查
        run: python -m compileall -q .

      - name: Worker 脚本语法检查
        run: |
          cp cloudflare/worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Worker 轮询去重回归（同一件事只做一次）
        run: node tests/test_worker_dedupe.mjs

      - name: 工作流配置解析
        run: |
          python - <<'PY'
          import glob
          import yaml

          files = sorted(glob.glob('.github/workflows/*.yml')) + ['.github/dependabot.yml']
          assert files, '没有找到任何工作流文件'
          for path in files:
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('OK', path)
          PY

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      # 曾经的 P0：strategy/pattern_config.py 把配置路径写死成 /root/quant-csv/...，
      # 云端 runner（非 root 用户）上 Path.exists() 抛 PermissionError，导致
      # pattern_config / pattern_library 导入失败、B1 图形匹配策略线上完全不可用，
      # 而 compileall + 单测都发现不了。下面这段就是"云端等价"的最小冒烟。
      - name: 云端等价冒烟（受限路径下必须能导入）
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import pathlib

          # 直接用文件路径加载，绕过 strategy/__init__.py（那里会拉 pandas/scipy 全套），
          # 只验证 pattern_config 自身的「受限路径下能否导入」这一件事。
          def load(env_path):
              if env_path is None:
                  os.environ.pop('STRATEGY_PARAMS_PATH', None)
              else:
                  os.environ['STRATEGY_PARAMS_PATH'] = env_path
              spec = importlib.util.spec_from_file_location('pc_under_test', 'strategy/pattern_config.py')
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          # 1) 正常导入：仓库内有 config/strategy_params.yaml，必须能读到而不是崩
          mod = load(None)
          assert isinstance(mod._yaml_config, dict), '_yaml_config 必须是 dict'
          assert len(mod.B1_PERFECT_CASES) >= 1, 'B1 案例配置不能为空'
          print('OK pattern_config：正常导入，案例数', len(mod.B1_PERFECT_CASES))

          # 2) 指向不可访问路径（模拟云端 /root）：必须静默降级，不能抛异常
          mod = load('/root/quant-csv/config/strategy_params.yaml')
          assert isinstance(mod._yaml_config, dict), '受限路径下应降级为空配置'
          print('OK pattern_config：受限路径下降级为空配置，未抛 PermissionError')

          # 3) 缓存路径不得落在仓库外（写不进去会拖垮案例库初始化）
          cache = pathlib.Path('strategy/pattern_library.py').read_text(encoding='utf-8')
          assert '/root/' not in cache, 'pattern_library 仍含硬编码 /root/ 路径'
          print('OK pattern_library：缓存路径已仓库内相对化')
          PY

      - name: 禁止硬编码本地绝对路径
        run: |
          if grep -rnE "['\"]/root/" --include='*.py' . ; then
            echo "::error::发现硬编码 /root/ 路径，云端 runner 无法访问"
            exit 1
          fi
          echo "未发现硬编码 /root/ 路径"

      - name: Action 版本固定检查
        run: |
          if grep -rnE 'uses:[[:space:]]*[^[:space:]#]+@v[0-9]' .github/workflows --include='*.yml'; then
            echo "::error::存在未固定到 commit SHA 的 Action，请改为 @<sha> # vN"
            exit 1
          fi
          echo "全部 Action 已固定到 commit SHA"
