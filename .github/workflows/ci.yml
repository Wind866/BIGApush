name: CI · 语法 / 单元 / 档期表

# 本仓库曾因 .gitignore 忽略 test_*.py 而长期零测试，
# 一个 utils 里的 f-string 语法错误也因此一直无人发现。
# 现在 compileall + unittest 是硬门禁：任何 py 文件写坏都过不了。
on:
  pull_request:
  # 原写法是 branches-ignore: [main]：本仓库大量改动直接提交到 main（含 bot
  # 台账提交），等于生产分支零校验。改成按路径触发：只改 .push-state / 数据文件
  # 的每日提交不会触发，任何代码 / 工作流 / 配置变更都会跑门禁。
  push:
    paths:
      - '**.py'
      - '**.js'
      - '**.mjs'
      - 'config/**'
      - 'requirements.txt'
      - '.github/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: 安装校验依赖
        # requests 是 daily_news.py / sector_data.py 的运行时依赖；不装的话
        # 单测里 import 新闻脚本会在 CI 上直接 ImportError。
        run: python -m pip install -q "PyYAML>=6.0,<7" pyflakes requests

      - name: Python 全仓库语法检查
        run: python -m compileall -q .

      - name: Worker 脚本语法检查
        run: |
          cp cloudflare/worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Worker 轮询去重回归（同一件事只做一次）
        run: node tests/test_worker_dedupe.mjs

      # 补齐 Cache 之外的两层：D1 原子认领、GitHub 派发守卫。
      # 仓库自带那条用例只覆盖 Cache，而线上失效的恰恰是 Cache。
      - name: Worker 去重补充回归（D1 认领 / GitHub 守卫）
        run: node tests/test_worker_dedupe_extra.mjs

      - name: 工作流配置解析
        run: |
          python - <<'PY'
          import glob
          import yaml

          files = sorted(glob.glob('.github/workflows/*.yml')) + ['.github/dependabot.yml']
          assert files, '没有找到任何工作流文件'
          for path in files:
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('OK', path)
          PY

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      # 未定义名 = 一旦走到那条分支就 NameError。compileall 和单测都发现不了，
      # 因为出问题的往往是异常处理分支（真出事时才执行）。
      # 本项目实际踩过：trading/routes.py 缺 import json/datetime，
      # 「批量任务列表」和「方案导入导出」三个接口一直是坏的，却只表现为「没有数据」。
      - name: 未定义名检查（pyflakes）
        run: |
          python -m pyflakes $(git ls-files '*.py' | grep -v '^trading/ptrade/') > /tmp/pyflakes.txt || true
          if grep -E "undefined name|undefined local" /tmp/pyflakes.txt; then
            echo "::error::存在未定义变量，运行到该分支会 NameError"
            exit 1
          fi
          echo "未发现未定义变量（trading/ptrade 是券商平台模板，其全局由平台注入，已排除）"

      # 曾经的 P0：strategy/pattern_config.py 把配置路径写死成 /root/quant-csv/...，
      # 云端 runner（非 root 用户）上 Path.exists() 抛 PermissionError，导致
      # pattern_config / pattern_library 导入失败、B1 图形匹配策略线上完全不可用，
      # 而 compileall + 单测都发现不了。下面这段就是"云端等价"的最小冒烟。
      - name: 云端等价冒烟（受限路径下必须能导入）
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import pathlib

          # 直接用文件路径加载，绕过 strategy/__init__.py（那里会拉 pandas/scipy 全套），
          # 只验证 pattern_config 自身的「受限路径下能否导入」这一件事。
          def load(env_path):
              if env_path is None:
                  os.environ.pop('STRATEGY_PARAMS_PATH', None)
              else:
                  os.environ['STRATEGY_PARAMS_PATH'] = env_path
              spec = importlib.util.spec_from_file_location('pc_under_test', 'strategy/pattern_config.py')
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          # 1) 正常导入：仓库内有 config/strategy_params.yaml，必须能读到而不是崩
          mod = load(None)
          assert isinstance(mod._yaml_config, dict), '_yaml_config 必须是 dict'
          assert len(mod.B1_PERFECT_CASES) >= 1, 'B1 案例配置不能为空'
          print('OK pattern_config：正常导入，案例数', len(mod.B1_PERFECT_CASES))

          # 2) 指向不可访问路径（模拟云端 /root）：必须静默降级，不能抛异常
          mod = load('/root/quant-csv/config/strategy_params.yaml')
          assert isinstance(mod._yaml_config, dict), '受限路径下应降级为空配置'
          print('OK pattern_config：受限路径下降级为空配置，未抛 PermissionError')

          # 3) 缓存路径不得落在仓库外（写不进去会拖垮案例库初始化）
          cache = pathlib.Path('strategy/pattern_library.py').read_text(encoding='utf-8')
          assert '/root/' not in cache, 'pattern_library 仍含硬编码 /root/ 路径'
          print('OK pattern_library：缓存路径已仓库内相对化')
          PY

      - name: 禁止硬编码本地绝对路径
        run: |
          if grep -rnE "['\"]/root/" --include='*.py' . ; then
            echo "::error::发现硬编码 /root/ 路径，云端 runner 无法访问"
            exit 1
          fi
          echo "未发现硬编码 /root/ 路径"

      - name: Action 版本固定检查
        run: |
          if grep -rnE 'uses:[[:space:]]*[^[:space:]#]+@v[0-9]' .github/workflows --include='*.yml'; then
            echo "::error::存在未固定到 commit SHA 的 Action，请改为 @<sha> # vN"
            exit 1
          fi
          echo "全部 Action 已固定到 commit SHA"

      # 告警必须走 .github/actions/alert（内部调用 scripts/alert.py）：裸 curl 不发
      # sign 字段、也不解析飞书业务码，机器人开启加签后告警会静默哑掉（19021 但 HTTP 200）。
      - name: 告警通道统一入口检查
        run: |
          ACTION=.github/actions/alert/action.yml
          if ! grep -q 'scripts/alert.py' "$ACTION"; then
            echo "::error::复合告警动作没有复用 scripts/alert.py（加签与业务码校验会丢）"
            exit 1
          fi
          # 逐文件检查并跳过 ci.yml 自身：否则这条 grep 模式会匹配到自己
          # （脚本里写着 'curl ...$HOOK' 这个待检模式），门禁永远判红。
          for f in .github/workflows/*.yml; do
            if [ "$f" = ".github/workflows/ci.yml" ]; then continue; fi
            if grep -qE 'curl .*POST.*[$]HOOK' "$f"; then
              echo "::error::$f 仍是裸 curl 告警，请改用 ./.github/actions/alert"
              exit 1
            fi
            if grep -q 'if: failure()' "$f" && ! grep -q '.github/actions/alert' "$f"; then
              echo "::error::$f 有失败告警但未走统一入口 ./.github/actions/alert"
              exit 1
            fi
            if grep -q 'python scripts/alert.py' "$f"; then
              echo "::error::$f 仍在 workflow 里直连脚本，请改用 ./.github/actions/alert"
              exit 1
            fi
          done
          echo "全部失败告警均走 ./.github/actions/alert（内部 scripts/alert.py，带签名）"

      # workflow_dispatch 的 inputs 绝不能插值进 run 脚本（表达式注入）。
      # 正确做法：env: 传入 + os.environ 读取，或先白名单清洗。
      - name: Workflow 输入注入检查
        run: |
          python - <<'PY'
          import glob
          import yaml

          bad = []
          # 用 chr(36) 拼出表达式前缀：workflow 文件里出现未闭合的模板起始
          # 符号会被 Actions 当成表达式解析，导致整个 ci.yml 解析失败（jobs=0）。
          needle = chr(36) + "{{ inputs."
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, encoding='utf-8') as fh:
                  doc = yaml.safe_load(fh)
              for job in (doc.get('jobs') or {}).values():
                  for step in job.get('steps', []):
                      if needle in (step.get('run') or ''):
                          bad.append(f"{path}: {step.get('name', '(未命名步骤)')}")
          if bad:
              for item in bad:
                  print(f"::error::{item} 把 inputs 直接插入了 run 脚本")
              raise SystemExit(1)
          print('未发现 workflow inputs 源码插值')
          PY
