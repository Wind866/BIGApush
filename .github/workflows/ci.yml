name: CI · 语法 / 单元 / 档期表

# 本仓库曾因 .gitignore 忽略 test_*.py 而长期零测试，
# utils/buy_signal_judger.py 的 f-string 语法错误也一直无人发现。
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 安装校验依赖
        run: python -m pip install -q "PyYAML>=6.0,<7"

      - name: Python 全仓库语法检查
        run: python -m compileall -q .

      - name: Worker 脚本语法检查
        run: |
          cp cloudflare/worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: 工作流配置解析
        run: |
          python - <<'PY'
          import glob
          import yaml

          files = sorted(glob.glob('.github/workflows/*.yml')) + ['.github/dependabot.yml']
          assert files, '没有找到任何工作流文件'
          for path in files:
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('OK', path)
          PY

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: Action 版本固定检查
        run: |
          if grep -rnE 'uses:[[:space:]]*[^[:space:]#]+@v[0-9]' .github/workflows --include='*.yml'; then
            echo "::error::存在未固定到 commit SHA 的 Action，请改为 @<sha> # vN"
            exit 1
          fi
          echo "全部 Action 已固定到 commit SHA"
