name: 晚间新闻

# 北京时间 = UTC+8，每天 21:53 推送收盘总结与晚间要闻。
# 准点由 Cloudflare Worker 在 21:53 workflow_dispatch；下面的 cron 仅作兜底
# （实测 0/34 准时，延迟 3h17m~9h43m）。脚本侧有台账幂等守卫，不会重复推送。
#
# 当天任务当天完成：兜底档全部收敛在当天（最晚 23:53），不再铺次日凌晨档。
# 若被调度延迟拖到次日才运行，由「跨日守卫」步骤判红并告警，不静默补跑前一天档期。
on:
  schedule:
    - cron: '53 13 * * *'   # 北京 21:53 主档
    - cron: '53 14 * * *'   # 22:53
    - cron: '53 15 * * *'   # 23:53
  workflow_dispatch:
    inputs:
      force:
        description: '当天已推过也强制再推一次（调试用）'
        type: boolean
        default: false

# actions: read 供守卫查运行记录；contents: write 供推送成功后写台账
permissions:
  contents: write
  actions: read

concurrency:
  group: evening-news
  cancel-in-progress: false

env:
  # 告警凭据：composite action 里取不到 secrets，统一在 workflow env 注入一次
  ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
  ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
  TZ: Asia/Shanghai

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      # 锁版本并加主版本上界（与 requirements.txt 的 requests>=2.31.0,<3 一致），
      # 裸 pip install requests 会装到 breaking change 的新主版本；
      # 新闻链路只需 requests，不必装整份 requirements.txt（含 akshare 等重依赖）。
      - run: pip install "requests>=2.31.0,<3"

      # 补档按计划跑，不该被标成「主档迟到」。所有兜底档均在当天，无跨日档。
      - name: 推导本档计划时刻
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '53 13 * * *')  planned="2153" ;;
            '53 14 * * *')  planned="2253" ;;
            '53 15 * * *')  planned="2353" ;;
            *)              planned="2153" ;;
          esac
          echo "EXPECT_HHMM=$planned" >> "$GITHUB_ENV"

      # 当天任务当天完成：晚间档计划当天 21:53~23:53 完成。主档 21:53、兜底收在 23:53，
      # 正常情况下北京时间小时数必为 21~23；只要 < 21 就说明本档被调度延迟拖到了次日，
      # 按规则直接判红，由下方 failure() 告警带出原因，不采集、不推送、不写台账。
      # 旧版只判 < 8，实测有 09:06 才起来的次日运行漏过守卫（延迟超 10h），故收紧到 < 21。
      # 只约束 cron 兜底：Worker 准点派发的 workflow_dispatch 与人工 Run 不受此限。
      - name: 跨日守卫（当天任务当天完成）
        id: crossday
        if: github.event_name == 'schedule' && inputs.force != true
        run: |
          HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ "$HOUR" -lt 21 ]; then
            NOW=$(TZ=Asia/Shanghai date +'%F %H:%M')
            REASON="晚间新闻任务跨日运行：北京时间 $NOW 才触发，已过当天 21:53~23:53 档期窗口；按「当天任务当天完成」规则跳过推送并告警"
            echo "CROSS_REASON=$REASON" >> "$GITHUB_ENV"
            echo "::error::$REASON"
            exit 1
          fi
          echo "当天运行，跨日守卫通过（北京时间 $(TZ=Asia/Shanghai date +'%F %H:%M')）"

      - name: 推送晚间新闻
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # EXPECT_HHMM 由上一步写入 GITHUB_ENV
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
        run: python evening_news.py

      - name: 失败告警
        if: failure()
        uses: ./.github/actions/alert
        with:
          message: "${{ env.CROSS_REASON || '⚠️ 晚间新闻任务运行失败，请查看日志' }}"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 晚间新闻 job 被取消或超时（failure() 告警不会触发）"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
