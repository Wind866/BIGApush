name: 晚间新闻

# 北京时间 = UTC+8，每天 22:13 推送收盘总结与晚间要闻。
# 准点由 Cloudflare Worker 在 22:13 workflow_dispatch；下面的 cron 仅作兜底
# （实测 0/34 准时，延迟 3h17m~9h43m）。脚本侧有台账幂等守卫，不会重复推送。
on:
  schedule:
    - cron: '13 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '当天已推过也强制再推一次（调试用）'
        type: boolean
        default: false

# actions: read 供守卫查运行记录；contents: write 供推送成功后写台账
permissions:
  contents: write
  actions: read

concurrency:
  group: evening-news
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests

      - name: 推送晚间新闻
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          EXPECT_HHMM: "${{ github.event_name == 'schedule' && '2213' || '' }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
        run: python evening_news.py

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 晚间新闻任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || true
