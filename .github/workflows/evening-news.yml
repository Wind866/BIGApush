name: 晚间新闻

# 北京时间 = UTC+8，每天 22:13 推送收盘总结与晚间要闻。
# 准点由 Cloudflare Worker 在 22:13 workflow_dispatch；下面的 cron 仅作兜底
# （实测 0/34 准时，延迟 3h17m~9h43m）。脚本侧有台账幂等守卫，不会重复推送。
#
# 兜底窗口铺到次日 08:13（+10h）：晚间档常跨午夜才到，原来只到 +2h，
# 真正在跑的时刻没有任何 cron 档位。台账按 slot_hour=22 归并跨日档期，
# 补跑不会占用第二天的晚间档，也不会重复刷屏。
on:
  schedule:
    - cron: '13 14 * * *'   # 北京 22:13 主档
    - cron: '13 15 * * *'   # 23:13
    - cron: '13 16 * * *'   # 次日 00:13
    - cron: '13 18 * * *'   # 次日 02:13  (+4h)
    - cron: '13 21 * * *'   # 次日 05:13  (+7h)
    - cron: '13 0 * * *'    # 北京 08:13   (+10h)
  workflow_dispatch:
    inputs:
      force:
        description: '当天已推过也强制再推一次（调试用）'
        type: boolean
        default: false

# actions: read 供守卫查运行记录；contents: write 供推送成功后写台账
permissions:
  contents: write
  actions: read

concurrency:
  group: evening-news
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      # 锁版本并加主版本上界（与 requirements.txt 的 requests>=2.31.0,<3 一致），
      # 裸 pip install requests 会装到 breaking change 的新主版本；
      # 新闻链路只需 requests，不必装整份 requirements.txt（含 akshare 等重依赖）。
      - run: pip install "requests>=2.31.0,<3"

      # 补档按计划跑，不该被标成「主档迟到」。跨午夜的档期对应次日 HHMM，
      # 与 push_guard 的 slot_hour=22 档期归并互不干扰（台账不看 EXPECT_HHMM）。
      - name: 推导本档计划时刻
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '13 14 * * *')  planned="2213" ;;
            '13 15 * * *')  planned="2313" ;;
            '13 16 * * *')  planned="0013" ;;
            '13 18 * * *')  planned="0213" ;;
            '13 21 * * *')  planned="0513" ;;
            '13 0 * * *')   planned="0813" ;;
            *)              planned="2213" ;;
          esac
          echo "EXPECT_HHMM=$planned" >> "$GITHUB_ENV"

      - name: 推送晚间新闻
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # EXPECT_HHMM 由上一步写入 GITHUB_ENV
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
        run: python evening_news.py

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/alert.py "⚠️ 晚间新闻任务运行失败，请查看日志" --run-url "$RUN_URL" \
            || echo "::error::告警发送失败（独立告警通道可能也失效）"

      # job 被整体取消（timeout-minutes 到点 / 手动 cancel）时状态是 cancelled 不是
      # failure，GitHub 不会执行上面那条 if: failure() —— 超时恰恰是最需要告警的时刻。
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/alert.py "⚠️ 晚间新闻 job 被取消或超时（failure() 告警不会触发）" --run-url "$RUN_URL" \
            || echo "::error::告警发送失败（独立告警通道可能也失效）"
