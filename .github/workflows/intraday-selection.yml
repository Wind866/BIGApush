name: 盘中选股

# 北京时间 = UTC+8。12:53 盘中快照（周一至周五），节假日由脚本自动跳过。
# 分钟数避开 :00 / :30，与 limit-up-relay 的 18:53 收盘档互不干扰（其 12:33 盘中档已下线）。
# 准点由 Cloudflare Worker 触发；GitHub cron 只作兜底。
# 迟到不再拦截推送（见脚本内说明），重复由台账幂等守卫负责。
#
# 兜底铺到 +6h（18:53）。盘中快照时效性强，再晚的数据参考价值很低，
# 所以不像新闻类档期那样铺到 +10h；卡片会标注真实数据时点。
on:
  schedule:
    - cron: '53 4 * * 1-5'    # 北京 12:53 主档
    - cron: '53 5 * * 1-5'    # 13:53
    - cron: '53 6 * * 1-5'    # 14:53
    - cron: '53 8 * * 1-5'    # 16:53  (+4h)
    - cron: '53 10 * * 1-5'   # 18:53  (+6h)
  workflow_dispatch:
    inputs:
      force:
        description: '本档期已推过也强制再推一次（调试用）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: intraday-selection
  cancel-in-progress: false

env:
  # 告警凭据：composite action 里取不到 secrets，统一在 workflow env 注入一次
  ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
  ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
  TZ: Asia/Shanghai

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # 补档按计划执行，不该被写成「主档迟到 60 分钟」而误导看卡片的人。
      - name: 推导本档计划时刻
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '53 4 * * 1-5')   planned="1253" ;;
            '53 5 * * 1-5')   planned="1353" ;;
            '53 6 * * 1-5')   planned="1453" ;;
            '53 8 * * 1-5')   planned="1653" ;;
            '53 10 * * 1-5')  planned="1853" ;;
            *)                 planned="1253" ;;
          esac
          echo "EXPECT_HHMM=$planned" >> "$GITHUB_ENV"

      - name: 交易日预检
        id: trading
        run: python intraday_selection.py --check-trading-day

      - name: 盘中选股并推送飞书
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # EXPECT_HHMM 由「推导本档计划时刻」写入 GITHUB_ENV；只用于卡片标注，
          # 不用于拦截推送，也不参与台账判重（台账按 slot_hour=12 归并）。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
        run: python intraday_selection.py

      - name: 非交易日提示
        if: steps.trading.outputs.is_trading != 'true' && inputs.force != true
        run: echo "::notice::非交易日，已跳过盘中选股推送"

      - name: 失败告警
        if: failure()
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 盘中选股任务运行失败，请查看日志"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 盘中选股 job 被取消或超时（failure() 告警不会触发）"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
