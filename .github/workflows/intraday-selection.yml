name: 盘中选股

# 北京时间 = UTC+8。13:13 盘中快照（周一至周五），节假日由脚本自动跳过。
# 分钟数避开 :00 / :30，并与 limit-up-relay 的 13:07 错开 6 分钟。
# 准点由 Cloudflare Worker 触发；GitHub cron 只作兜底。
# 迟到不再拦截推送（见脚本内说明），重复由台账幂等守卫负责。
on:
  schedule:
    - cron: '13 5 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '本档期已推过也强制再推一次（调试用）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: intraday-selection
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 交易日预检
        id: trading
        run: python intraday_selection.py --check-trading-day

      - name: 盘中选股并推送飞书
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 计划时刻仅用于卡片标注，不再用于拦截推送
          EXPECT_HHMM: "${{ github.event_name == 'schedule' && '1313' || '' }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
        run: python intraday_selection.py

      - name: 非交易日提示
        if: steps.trading.outputs.is_trading != 'true' && inputs.force != true
        run: echo "::notice::非交易日，已跳过盘中选股推送"

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 盘中选股任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || true
