name: Keep Alive

# GitHub 只在仓库连续 60 天无任何活动时才禁用定时任务，每周一次足够。
# 原来每天一次会产生大量 "chore: keep alive" 噪音提交，这里改为每周一
# UTC 17:00（北京时间周二 01:00），并顺便裁剪日志，避免无限膨胀。
on:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 记录心跳并裁剪日志
        run: |
          echo "Keep alive at $(date '+%Y-%m-%d %H:%M:%S %Z')" >> .github/keep-alive.log
          tail -n 60 .github/keep-alive.log > .github/keep-alive.log.tmp
          mv .github/keep-alive.log.tmp .github/keep-alive.log

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f：即使 .gitignore 把 *.log 忽略了也能提交，心跳不能因一条规则失效
          git add -f .github/keep-alive.log
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: keep alive $(date '+%Y-%m-%d')"
          # 外部提交（人工 / dependabot / 其他 bot）可能已推进远端，
          # 单次 pull --rebase 失败会让本周心跳白跑。
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "已推送（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::推送失败（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin "$BRANCH" || { git rebase --abort 2>/dev/null || true; }
            sleep $((i * 2))
          done
          echo "::error::连续 3 次推送失败，本周心跳未入库"
          exit 1
