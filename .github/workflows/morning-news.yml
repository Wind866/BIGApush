name: 早间新闻

# 北京时间 = UTC+8，每天 08:43 推送早间要闻（周末也推送财经新闻）
# 分钟数避开 :00 / :30。GitHub schedule 只保证"尽力而为"，延迟 ≥60 分钟时
# 脚本会在消息里标注"延迟推送"，避免"早安"在中午发出还不自知。
on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-news
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests

      - name: 推送早间新闻
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          EXPECT_HHMM: '0843'
        run: python daily_news.py

      - name: 失败告警
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then echo "未配置 FEISHU_WEBHOOK，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$FEISHU_WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 早间新闻任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || true
