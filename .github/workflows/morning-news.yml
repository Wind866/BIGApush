name: 早间新闻

# 北京时间 = UTC+8，每天 08:13 推送早间要闻（周末也推送财经新闻）。
# 准点由 Cloudflare Worker（见 cloudflare/README.md）workflow_dispatch；
# 下面的 cron 只作兜底 —— GitHub schedule 实测可晚数小时甚至丢弃档期。
# 两个触发器不会重复推送：daily_news.py 先过 utils/push_guard.py 台账守卫。
#
# 兜底窗口按实测延迟铺到 +10 小时（08:13 → 18:13）。原来只铺到 +2 小时，
# 而本账号 schedule 实测延迟 3.3~9.7 小时，真正会跑的时刻根本没有任何 cron
# 档位，等于 Worker 一失效就彻底漏档。台账按档期判重，多铺的档位不会刷屏。
on:
  schedule:
    - cron: '13 0 * * *'    # 北京 08:13 主档
    - cron: '13 1 * * *'    # 09:13
    - cron: '13 2 * * *'    # 10:13
    - cron: '13 4 * * *'    # 12:13  (+4h)
    - cron: '13 7 * * *'    # 15:13  (+7h)
    - cron: '13 10 * * *'   # 18:13  (+10h)
  workflow_dispatch:
    inputs:
      force:
        description: '本档期已推过也强制再推一次（调试用）'
        type: boolean
        default: false

permissions:
  contents: write          # 推送成功后把档期写进 .push-state/ledger.json
  actions: read

concurrency:
  group: morning-news
  cancel-in-progress: false

env:
  # 告警凭据：composite action 里取不到 secrets，统一在 workflow env 注入一次
  ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
  ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
  TZ: Asia/Shanghai

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      # 锁版本并加主版本上界（与 requirements.txt 的 requests>=2.31.0,<3 一致），
      # 裸 pip install requests 会装到 breaking change 的新主版本；
      # 新闻链路只需 requests，不必装整份 requirements.txt（含 akshare 等重依赖）。
      - run: pip install "requests>=2.31.0,<3"

      # 当天任务当天完成：早间档主档 08:13、兜底收在 18:13。只要北京时间 < 08:00
      # 就说明本档被调度延迟拖到了次日凌晨（旧版无此守卫，实测有次日 04:25/01:02
      # 才起来的运行）。按规则直接判红告警、不推送、不写台账；force 人工触发不受限。
      # 只约束 cron 兜底：Worker 准点派发的 workflow_dispatch 与人工 Run 不受此限。
      - name: 跨日守卫（当天任务当天完成）
        id: crossday
        if: github.event_name == 'schedule' && inputs.force != true
        run: |
          HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ "$HOUR" -lt 8 ]; then
            NOW=$(TZ=Asia/Shanghai date +'%F %H:%M')
            REASON="早间新闻任务跨日运行：北京时间 $NOW 才触发，已过当日 08:13~18:13 档期窗口；按「当天任务当天完成」规则跳过推送并告警"
            echo "CROSS_REASON=$REASON" >> "$GITHUB_ENV"
            echo "::error::$REASON"
            exit 1
          fi
          echo "当天运行，跨日守卫通过（北京时间 $(TZ=Asia/Shanghai date +'%F %H:%M')）"

      # 补档是按计划执行的，不该被标成「主档迟到 60 分钟」。
      # 用 github.event.schedule 精确映射本档计划时刻，写入 GITHUB_ENV 供推送脚本
      # 标注数据时点；手动 dispatch 时本步跳过，脚本不做延迟判定。
      - name: 推导本档计划时刻
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '13 0 * * *')   planned="0813" ;;
            '13 1 * * *')   planned="0913" ;;
            '13 2 * * *')   planned="1013" ;;
            '13 4 * * *')   planned="1213" ;;
            '13 7 * * *')   planned="1513" ;;
            '13 10 * * *')  planned="1813" ;;
            *)              planned="0813" ;;
          esac
          echo "EXPECT_HHMM=$planned" >> "$GITHUB_ENV"

      - name: 推送早间新闻
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # EXPECT_HHMM 由上一步写入 GITHUB_ENV；手动 dispatch 时不设置
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
        run: python daily_news.py

      - name: 失败告警
        if: failure()
        uses: ./.github/actions/alert
        with:
          message: "${{ env.CROSS_REASON || '⚠️ 早间新闻任务运行失败，请查看日志' }}"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 早间新闻 job 被取消或超时（failure() 告警不会触发）"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
