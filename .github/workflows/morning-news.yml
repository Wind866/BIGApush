name: 早间新闻

# 北京时间 = UTC+8，每天 08:43 推送早间要闻（周末也推送财经新闻）。
# 准点由 Cloudflare Worker（见 cloudflare/README.md）workflow_dispatch；
# 下面的 cron 只作兜底 —— GitHub schedule 实测可晚数小时甚至丢弃档期。
# 两个触发器不会重复推送：daily_news.py 先过 utils/push_guard.py 台账守卫。
on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '本档期已推过也强制再推一次（调试用）'
        type: boolean
        default: false

permissions:
  contents: write          # 推送成功后把档期写进 .push-state/ledger.json
  actions: read

concurrency:
  group: morning-news
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests

      - name: 推送早间新闻
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 仅 schedule 触发时标注计划时刻；手动 dispatch 是"我现在就要结果"
          EXPECT_HHMM: "${{ github.event_name == 'schedule' && '0843' || '' }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
        run: python daily_news.py

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "::error::未配置独立告警 Secret ALERT_WEBHOOK；本次告警退回业务 webhook，业务 webhook 故障时告警会一并失效"
          fi
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "::error::未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 早间新闻任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || echo "::error::告警发送失败（独立告警通道可能也失效）"
