name: 早间新闻

# 北京时间 = UTC+8，每天 08:43 推送早间要闻（周末也推送财经新闻）。
# 准点由 Cloudflare Worker（见 cloudflare/README.md）workflow_dispatch；
# 下面的 cron 只作兜底 —— GitHub schedule 实测可晚数小时甚至丢弃档期。
# 两个触发器不会重复推送：daily_news.py 先过 utils/push_guard.py 台账守卫。
#
# 兜底窗口按实测延迟铺到 +10 小时（08:43 → 18:43）。原来只铺到 +2 小时，
# 而本账号 schedule 实测延迟 3.3~9.7 小时，真正会跑的时刻根本没有任何 cron
# 档位，等于 Worker 一失效就彻底漏档。台账按档期判重，多铺的档位不会刷屏。
on:
  schedule:
    - cron: '43 0 * * *'    # 北京 08:43 主档
    - cron: '43 1 * * *'    # 09:43
    - cron: '43 2 * * *'    # 10:43
    - cron: '43 4 * * *'    # 12:43  (+4h)
    - cron: '43 7 * * *'    # 15:43  (+7h)
    - cron: '43 10 * * *'   # 18:43  (+10h)
  workflow_dispatch:
    inputs:
      force:
        description: '本档期已推过也强制再推一次（调试用）'
        type: boolean
        default: false

permissions:
  contents: write          # 推送成功后把档期写进 .push-state/ledger.json
  actions: read

concurrency:
  group: morning-news
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 锁版本并加主版本上界（与 requirements.txt 的 requests>=2.31.0,<3 一致），
      # 裸 pip install requests 会装到 breaking change 的新主版本；
      # 新闻链路只需 requests，不必装整份 requirements.txt（含 akshare 等重依赖）。
      - run: pip install "requests>=2.31.0,<3"

      # 补档是按计划执行的，不该被标成「主档迟到 60 分钟」。
      # 用 github.event.schedule 精确映射本档计划时刻，写入 GITHUB_ENV 供推送脚本
      # 标注数据时点；手动 dispatch 时本步跳过，脚本不做延迟判定。
      - name: 推导本档计划时刻
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '43 0 * * *')   planned="0843" ;;
            '43 1 * * *')   planned="0943" ;;
            '43 2 * * *')   planned="1043" ;;
            '43 4 * * *')   planned="1243" ;;
            '43 7 * * *')   planned="1543" ;;
            '43 10 * * *')  planned="1843" ;;
            *)              planned="0843" ;;
          esac
          echo "EXPECT_HHMM=$planned" >> "$GITHUB_ENV"

      - name: 推送早间新闻
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # EXPECT_HHMM 由上一步写入 GITHUB_ENV；手动 dispatch 时不设置
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
        run: python daily_news.py

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/alert.py "⚠️ 早间新闻任务运行失败，请查看日志" --run-url "$RUN_URL" \
            || echo "::error::告警发送失败（独立告警通道可能也失效）"

      # job 被整体取消（timeout-minutes 到点 / 手动 cancel）时状态是 cancelled 不是
      # failure，GitHub 不会执行上面那条 if: failure() —— 超时恰恰是最需要告警的时刻。
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/alert.py "⚠️ 早间新闻 job 被取消或超时（failure() 告警不会触发）" --run-url "$RUN_URL" \
            || echo "::error::告警发送失败（独立告警通道可能也失效）"
