name: 档期对账 · 应到 / 实到

# 事后核对，不是准点任务：GitHub cron 晚几小时不影响结论。
# 目的是让「今天到底有没有按时跑」有据可查，而不是靠翻 Actions 列表猜。
# 必须每天跑，不能限工作日：PLAN 里的 08:13 早间新闻 / 21:53 晚间新闻是
# days: all，周末同样要推；限 1-5 会让周末漏跑无人发现。脚本会自己按
# PLAN 的 days 规则算出当日应到档期，工作日 8 个 / 周末 2 个，不会多报。
on:
  schedule:
    - cron: '33 14 * * *'      # 北京 22:33，收齐当日全部档期
  workflow_dispatch:
    inputs:
      date:
        description: '对账日期 YYYY-MM-DD（留空 = 今天北京时间）'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: schedule-audit
  cancel-in-progress: false

env:
  # 告警凭据：composite action 里取不到 secrets，统一在 workflow env 注入一次
  ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
  ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # AUDIT_PAT 是可选的 fine-grained PAT（三仓库 Actions: read）。
      # 不配置时脚本只核对本仓库，其余标「未覆盖」而不误判为漏跑。
      - name: 生成档期对账报告
        env:
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_DATE: ${{ inputs.date }}
          TZ: Asia/Shanghai
        run: python scripts/schedule_audit.py

      - name: 上传对账报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schedule-audit-${{ github.run_id }}
          path: docs/schedule-audit.md
          if-no-files-found: ignore
          retention-days: 14

      - name: 对账异常告警
        if: failure()
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 档期对账发现漏跑或异常，请查看日志"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 档期对账 job 被取消或超时（failure() 告警不会触发）"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
