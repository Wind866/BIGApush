name: 收盘选股

# 北京时间 = UTC+8。15:43 收盘定稿（周一至周五），节假日由交易日预检跳过。
# 分钟数与 limit-up-relay 的 15:37 错开 6 分钟，避开整点拥堵。
# 准点由 Cloudflare Worker 触发；GitHub cron 只作兜底。
on:
  schedule:
    - cron: '43 7 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_update:
        description: 跳过全量数据更新（用缓存数据库快速跑一次）
        type: boolean
        default: false
      force:
        description: '非交易日也强制运行 / 本档期已推过也强制再推'
        type: boolean
        default: false

permissions:
  contents: write          # 推送台账 .push-state/ledger.json
  actions: read

concurrency:
  group: selection
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  run-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 纯标准库，可在装依赖前运行；用行情时间戳识别节假日
      - name: 交易日预检
        id: trading
        run: python intraday_selection.py --check-trading-day

      - name: 调度延迟检查（仅提示，不阻断）
        if: github.event_name == 'schedule'
        run: |
          planned=$(date -d "today 15:43" +%s)
          late=$(( ( $(date +%s) - planned ) / 60 ))
          if [ "$late" -lt 0 ]; then late=$(( late + 1440 )); fi
          if [ "$late" -ge 30 ]; then
            echo "::warning::比计划（北京 15:43）晚 $late 分钟，属 GitHub 调度延迟"
            echo "### ⚠️ 调度延迟 $late 分钟" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "准点运行（偏差 ${late} 分钟）"
          fi

      - name: 安装依赖
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        run: pip install -r requirements.txt

      # 按北京日期做缓存键：同一天多次运行复用、跨天更新，避免 run_id 造成缓存无限增长
      - name: 计算缓存键
        id: cachekey
        run: echo "day=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 恢复数据库缓存
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # 只缓存主库，SQLite 的 -shm/-wal 是运行时临时文件，缓存会导致状态不一致
          path: data/stock_selection.db
          key: stock-db-${{ runner.os }}-v2-${{ steps.cachekey.outputs.day }}
          restore-keys: |
            stock-db-${{ runner.os }}-v2-

      - name: 检查数据库
        id: check-db
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        run: |
          if [ -f "data/stock_selection.db" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 初始化数据（首次运行）
        if: (steps.trading.outputs.is_trading == 'true' || inputs.force == true) && steps.check-db.outputs.exists == 'false'
        run: python main.py init
        timeout-minutes: 45

      - name: 运行收盘选股并推送
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
          SKIP_DATA_UPDATE: ${{ inputs.skip_update && '1' || '0' }}
        run: python main.py run
        # 实测最长 51.9 分钟（数据更新 30 分 + 选股推送 20 分），原来 55 分只剩 3 分余量，
        # 数据源一慢就整档被砍；提到 75 分（job 90 分内，仍留 15 分给收尾与推送）
        timeout-minutes: 75

      - name: 非交易日提示
        if: steps.trading.outputs.is_trading != 'true' && inputs.force != true
        run: echo "::notice::非交易日，已跳过收盘选股"

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "::error::未配置独立告警 Secret ALERT_WEBHOOK；本次告警退回业务 webhook，业务 webhook 故障时告警会一并失效"
          fi
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "::error::未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 收盘选股任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || echo "::error::告警发送失败（独立告警通道可能也失效）"
