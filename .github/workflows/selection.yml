name: 收盘选股

# 北京时间 = UTC+8。19:33 收盘定稿（周一至周五），节假日由交易日预检跳过。
# 分钟数与 limit-up-relay 的 18:53 错开 40 分钟，避开整点拥堵。
# 准点由 Cloudflare Worker 触发；GitHub cron 只作兜底。
#
# 收盘数据次日上午仍有参考价值，兜底铺到次日 01:33（+6h）；原来只有 +1h，
# 而实测延迟 3.3~9.7 小时，兜底基本接不住。台账按 slot_hour=19 判重，
# 多档触发会被秒级跳过。
on:
  schedule:
    - cron: '33 11 * * 1-5'   # 北京 19:33 主档
    - cron: '33 12 * * 1-5'   # 20:33
    - cron: '33 14 * * 1-5'   # 22:33  (+3h)
    - cron: '33 15 * * 1-5'   # 23:33  (+4h)
    - cron: '33 17 * * 1-5'   # 次日 01:33  (+6h)
  workflow_dispatch:
    inputs:
      skip_update:
        description: 跳过全量数据更新（用缓存数据库快速跑一次）
        type: boolean
        default: false
      force:
        description: '非交易日也强制运行 / 本档期已推过也强制再推'
        type: boolean
        default: false

permissions:
  contents: write          # 推送台账 .push-state/ledger.json
  actions: read

concurrency:
  group: selection
  cancel-in-progress: false

env:
  # 告警凭据：composite action 里取不到 secrets，统一在 workflow env 注入一次
  ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
  ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
  TZ: Asia/Shanghai

jobs:
  run-selection:
    runs-on: ubuntu-latest
    # 必须大于两个 step 上限之和（55 + 75 = 130），留 20 分钟给安装依赖与收尾。
    # 旧值 90 会让 job 先于 step 超时被整体取消：GitHub 取消 job 时不执行
    # if: failure() 的告警步骤，也不执行 actions/cache 的 post 保存步骤 ——
    # 于是当天既没有推送、没有告警，数据库缓存也丢了，次日又从零全量抓取。
    # 现在让 step 级超时先触发（属于 failure，告警与缓存保存都会执行）。
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      # 纯标准库，可在装依赖前运行；用行情时间戳识别节假日
      # --catchup：19:33 的档期被调度延迟拖到次日凌晨时，行情日期必然是昨天。
      # 旧版直接判「非交易日」静默退出，当天收盘定稿永久丢失；带 --catchup 后
      # 改按「上一交易日的数据补跑」，台账再按该数据日期判重，不会重复刷屏。
      - name: 交易日预检
        id: trading
        run: python intraday_selection.py --check-trading-day --catchup

      # 把「数据日期」显式传给后面的步骤：补跑时它 != 今天，
      # 台账（PUSH_GUARD_DATE）与数据更新策略都要按它走。
      - name: 判定本次口径（正常 / 跨夜补跑）
        id: session
        if: steps.trading.outputs.is_trading == 'true'
        env:
          DATA_DATE: ${{ steps.trading.outputs.data_date }}
          CATCHUP: ${{ steps.trading.outputs.catchup }}
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ "$CATCHUP" = "true" ]; then
            echo "::warning::跨夜补跑：本次按 ${DATA_DATE} 的数据出收盘定稿（台账同按该日期判重）"
          fi
          echo "data_date=${DATA_DATE:-$TODAY}" >> "$GITHUB_OUTPUT"
          echo "catchup=${CATCHUP:-false}" >> "$GITHUB_OUTPUT"

      - name: 调度延迟检查（仅提示，不阻断）
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 每条 cron 都是自己的计划时刻；旧版写死 15:43，会把 16:43 的
          # 正常补档误报成「比计划晚 60 分钟」。
          case "$SCHEDULE" in
            '33 11 * * 1-5')  plan="19:33" ;;
            '33 12 * * 1-5')  plan="20:33" ;;
            '33 14 * * 1-5')  plan="22:33" ;;
            '33 15 * * 1-5')  plan="23:33" ;;
            '33 17 * * 1-5')  plan="01:33" ;;
            *)                plan="19:33" ;;
          esac
          planned=$(date -d "today $plan" +%s)
          late=$(( ( $(date +%s) - planned ) / 60 ))
          if [ "$late" -lt 0 ]; then late=$(( late + 1440 )); fi
          if [ "$late" -ge 30 ]; then
            echo "::warning::比计划（北京 $plan）晚 $late 分钟，属 GitHub 调度延迟"
            echo "### ⚠️ 调度延迟 $late 分钟（计划 $plan）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "准点运行（偏差 ${late} 分钟，计划 $plan）"
          fi

      - name: 安装依赖
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        run: pip install -r requirements.txt

      # 按北京日期做缓存键：同一天多次运行复用、跨天更新，避免 run_id 造成缓存无限增长
      - name: 计算缓存键
        id: cachekey
        run: echo "day=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 恢复数据库缓存
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # 只缓存主库，SQLite 的 -shm/-wal 是运行时临时文件，缓存会导致状态不一致
          path: data/stock_selection.db
          key: stock-db-${{ runner.os }}-v2-${{ steps.cachekey.outputs.day }}
          restore-keys: |
            stock-db-${{ runner.os }}-v2-

      - name: 检查数据库
        id: check-db
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        run: |
          if [ -f "data/stock_selection.db" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 初始化数据（首次运行）
        if: (steps.trading.outputs.is_trading == 'true' || inputs.force == true) && steps.check-db.outputs.exists == 'false'
        run: python main.py init
        # 冷启动预算：job 上限 150 分钟。原先这里 45 + 下面的 run 75 最多要 120 分钟，
        # 一旦数据源偏慢，整个 job 会被直接砍掉——初始化白跑、缓存也没保存下来，
        # 于是第二天再从零来一遍（等于每天白烧一小时 Actions 额度）。
        # 现在 init 给 55 分钟，且冷启动时下面那步跳过增量更新（init 刚抓完就是最新），
        # 实际路径约 55 + 20 = 75 分钟内。
        timeout-minutes: 55

      - name: 运行收盘选股并推送
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
          # 跨夜补跑时数据日期是上一交易日，台账必须按它判重，否则同一份数据
          # 会因为在次日凌晨运行而被算成新档期，重复推一条。
          PUSH_GUARD_DATE: ${{ steps.session.outputs.data_date }}
          # 冷启动（库不存在）刚跑完 init，数据已是最新；再走一遍增量更新纯属重复耗时，
          # 而且正是它把冷启动推到 150 分钟上限之外。
          # 补跑同理：上一交易日的 K 线早已入库，凌晨再抓一遍只是白烧 Actions 额度。
          SKIP_DATA_UPDATE: ${{ (inputs.skip_update || steps.check-db.outputs.exists == 'false' || steps.session.outputs.catchup == 'true') && '1' || '0' }}
          CATCHUP: ${{ steps.session.outputs.catchup }}
          SESSION_DATE: ${{ steps.session.outputs.data_date }}
        run: |
          if [ "$CATCHUP" = "true" ]; then
            # 补跑时运行日可能已是周末/次日，main.py 自带的交易日闸门会直接退出，
            # 用包装脚本只放行闸门，选股与推送逻辑一行不动。
            python scripts/run_close_catchup.py
          else
            python main.py run
          fi
        # 实测最长 51.9 分钟（数据更新 30 分 + 选股推送 20 分），原来 55 分只剩 3 分余量，
        # 数据源一慢就整档被砍；提到 75 分（job 150 分内，仍留 20 分给收尾与推送）
        timeout-minutes: 75

      - name: 导出选股结果（供 A股事件筛选器联动）
        if: steps.trading.outputs.is_trading == 'true' || inputs.force == true
        # 只读数据库导出，db 不存在 / 无记录时脚本自行 exit 0，不影响主流程
        run: |
          python scripts/export_selection.py || echo "::warning::选股结果导出失败（不影响选股主流程）"
          if [ ! -f exports/selection-latest.json ]; then
            echo "::notice::没有可导出的选股记录，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/selection-latest.json
          if git diff --cached --quiet; then
            echo "选股结果无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 选股结果 $(TZ=Asia/Shanghai date +%F) [skip ci]" --no-verify
          # 台账/缓存可能已被主流程推送过，rebase 后重试，冲突时不阻断选股
          for i in 1 2 3; do
            if git push; then
              echo "已推送选股结果"; exit 0
            fi
            git pull --rebase --autostash origin main || break
          done
          echo "::warning::选股结果推送失败（不影响选股主流程）"

      - name: 非交易日提示
        if: steps.trading.outputs.is_trading != 'true' && inputs.force != true
        run: echo "::notice::非交易日，已跳过收盘选股"

      - name: 失败告警
        if: failure()
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 收盘选股任务运行失败，请查看日志"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 收盘选股 job 被取消或超时（failure() 告警不会触发）"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
