name: 个股深度分析 · 查询即推送

# 手动填股票代码 → runner 上跑真实数据取数（行情/资金流/估值/财务）
# → 策略信号 + 买入建议 → 推送飞书群。
#
# 与「验证 · 真实数据取数」工作流的区别：那个是给开发看的数据源自检，只打日志；
# 这个面向群里，结论会真的推到飞书，并同时写进运行页 Summary。
# 不随 push/PR 自动运行，也不进每日档期，只有手动点一次才跑。
on:
  workflow_dispatch:
    inputs:
      stocks:
        description: '股票代码，逗号分隔（6 位，最多 6 只）'
        required: true
        default: '600519'
        type: string
      period:
        description: '分析周期：30d / 90d / 180d / 1y'
        required: false
        default: '90d'
        type: string

permissions:
  contents: read

concurrency:
  group: stock-query
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  query:
    runs-on: ubuntu-latest
    # 单只约 40~60 秒（技术面 + 资金流 + 估值 + 财报各一轮取数），6 只给足余量
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 只装取数必需的两个包：akshare 自动带 pandas/numpy/requests，
      # PyYAML 是 utils.db_config 读 database.yaml 用的。避免为一次查询装 scipy/matplotlib。
      - name: 安装依赖
        run: python -m pip install -q "akshare==1.20.42" "PyYAML>=6.0,<7"

      - name: 分析并推送飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          STOCK_CODES: ${{ inputs.stocks }}
          PERIOD: ${{ inputs.period }}
        run: python stock_query.py

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "::error::未配置独立告警 Secret ALERT_WEBHOOK；本次告警退回业务 webhook，业务 webhook 故障时告警会一并失效"
          fi
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "::error::未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 个股查询任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || echo "::error::告警发送失败（独立告警通道可能也失效）"
