name: 个股深度分析 · 查询即推送

# 手动填股票代码 → runner 上跑真实数据取数（行情/资金流/估值/财务）
# → 策略信号 + 买入建议 → 推送飞书群。
#
# 与「验证 · 真实数据取数」工作流的区别：那个是给开发看的数据源自检，只打日志；
# 这个面向群里，结论会真的推到飞书，并同时写进运行页 Summary。
# 不随 push/PR 自动运行，也不进每日档期，只有手动点一次才跑。
on:
  workflow_dispatch:
    inputs:
      stocks:
        description: '股票代码，逗号分隔（6 位，最多 6 只）'
        required: true
        default: '600519'
        type: string
      period:
        description: '分析周期：30d / 90d / 180d / 1y'
        required: false
        default: '90d'
        type: string
      chat_id:
        description: '（一般不用填）由飞书机器人自动带入：把结果发回提问的那个会话'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: stock-query
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  query:
    runs-on: ubuntu-latest
    # 单只约 40~60 秒（技术面 + 资金流 + 估值 + 财报各一轮取数），6 只给足余量
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # akshare 自动带 pandas/numpy/requests；PyYAML 是 utils.db_config 读 database.yaml 用的；
      # matplotlib 用于把结论画成图片卡片（不装 mplfinance，K 线自己手绘）。
      - name: 安装依赖
        run: python -m pip install -q "akshare==1.20.42" "PyYAML>=6.0,<7" "matplotlib>=3.7,<4"

      # 中文字体：runner 默认没有 CJK 字库，缺了会画成方块（代码里检测不到字体就自动退回文本）
      - name: 安装中文字体
        run: |
          if fc-list :lang=zh >/dev/null 2>&1 && [ -n "$(fc-list :lang=zh)" ]; then
            echo "已有中文字体，跳过安装"
          else
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq fonts-noto-cjk || echo "::warning::中文字体安装失败，本次将退回纯文本推送"
          fi
          fc-list :lang=zh | head -3 || true

      - name: 分析并推送飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 群里发代码触发时，Worker 会把 chat_id 传下来 → 结果回到那个群
          FEISHU_CHAT_ID: ${{ inputs.chat_id }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          STOCK_CODES: ${{ inputs.stocks }}
          PERIOD: ${{ inputs.period }}
          CARD_DIR: reports/cards
        run: python stock_query.py

      # 图片留在运行页，方便核对「群里看到的那张图」到底长什么样
      - name: 保存图片产物
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf470 # v4
        with:
          name: stock-cards
          path: reports/cards/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "::error::未配置独立告警 Secret ALERT_WEBHOOK；本次告警退回业务 webhook，业务 webhook 故障时告警会一并失效"
          fi
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "::error::未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 个股查询任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || echo "::error::告警发送失败（独立告警通道可能也失效）"
