name: 个股深度分析 · 查询即推送

# 运行页标题带上代码与会话 id：Actions 列表接口不返回 workflow_dispatch 的 inputs，
# 只能靠 run-name 给「同单 5 分钟内不重复推送」的守卫提供判重依据。
run-name: 个股查询 CODES=${{ inputs.stocks }} CHAT=${{ inputs.chat_id || vars.FEISHU_CHAT_ID }}

# 手动填股票代码 → runner 上跑真实数据取数（行情/资金流/估值/财务）
# → 策略信号 + 买入建议 → 推送飞书群。
#
# 与「验证 · 真实数据取数」工作流的区别：那个是给开发看的数据源自检，只打日志；
# 这个面向群里，结论会真的推到飞书，并同时写进运行页 Summary。
# 不随 push/PR 自动运行，也不进每日档期，只有手动点一次才跑。
on:
  workflow_dispatch:
    inputs:
      stocks:
        description: '股票代码，逗号分隔（6 位，最多 6 只）'
        required: true
        default: '600519'
        type: string
      period:
        description: '分析周期：30d / 90d / 180d / 1y'
        required: false
        default: '90d'
        type: string
      chat_id:
        description: '（一般不用填）由飞书机器人自动带入：把结果发回提问的那个会话'
        required: false
        default: ''
        type: string
      force:
        description: '同单 5 分钟内强制重跑（一般不勾；用于主动复查同一只票）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read    # 重复查询守卫要查本 workflow 的最近运行记录

concurrency:
  group: stock-query
  cancel-in-progress: false

env:
  # 告警凭据：composite action 里取不到 secrets，统一在 workflow env 注入一次
  ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
  ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
  TZ: Asia/Shanghai

jobs:
  query:
    runs-on: ubuntu-latest
    # 单只约 40~60 秒（技术面 + 资金流 + 估值 + 财报各一轮取数），6 只给足余量
    timeout-minutes: 25
    steps:
      # Worker 的轮询与事件回调可能把同一条查询派发两次；concurrency 只会排队不会去重。
      # 这里在跑真取数之前查一次运行记录：5 分钟内同会话 + 同组代码已存在就整段跳过。
      - name: 重复查询守卫
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CODES: ${{ inputs.stocks }}
          CHAT_ID: ${{ inputs.chat_id || vars.FEISHU_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timedelta, timezone

          def norm_codes(text):
              return ",".join(sorted(set(re.findall(r"(?<!\d)\d{6}(?!\d)", text or ""))))

          codes = norm_codes(os.environ.get("CODES", ""))
          chat = (os.environ.get("CHAT_ID") or "").strip()
          force = (os.environ.get("FORCE") or "").lower() == "true"
          skip = False

          if codes and not force:
              try:
                  url = (
                      f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                      "/actions/workflows/stock-query.yml/runs?per_page=20"
                  )
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "stock-query-dedupe",
                  })
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.load(resp)

                  cutoff = datetime.now(timezone.utc) - timedelta(minutes=5)
                  current = str(os.environ.get("CURRENT_RUN_ID", ""))
                  for run in data.get("workflow_runs", []):
                      if str(run.get("id")) == current:
                          continue
                      if run.get("event") != "workflow_dispatch":
                          continue
                      created = datetime.fromisoformat(
                          str(run.get("created_at", "")).replace("Z", "+00:00")
                      )
                      if created < cutoff:
                          continue
                      # 上一次失败/取消就允许重试：否则数据源抖动一次，这只票 5 分钟内都查不了。
                      # conclusion 为 None 表示仍在运行 —— 此时跳过是对的，结果马上就到。
                      if run.get("conclusion") not in (None, "", "success"):
                          continue
                      # 必须 display_title 在前：name 是工作流名（「个股深度分析 · 查询即推送」），
                      # 只有 display_title 才是 run-name 里的「个股查询 CODES=… CHAT=…」。
                      # 旧顺序用 `name or display_title`，name 永远非空 → 正则永远匹配不到
                      # CODES= → skip 恒为 False，守卫自上线起从未拦住过任何一次重复。
                      title = run.get("display_title") or run.get("name") or ""
                      m_codes = re.search(r"CODES=(\S*)", title)
                      m_chat = re.search(r"CHAT=(\S*)", title)
                      if not m_codes or norm_codes(m_codes.group(1)) != codes:
                          continue
                      title_chat = (m_chat.group(1) if m_chat else "").strip()
                      if chat and title_chat != chat:
                          continue
                      skip = True
                      print(
                          f"::notice::5 分钟内已有同单查询（run #{run.get('run_number')}），"
                          "本次跳过取数与推送；确需重跑请勾 force"
                      )
                      break
              except Exception as exc:
                  # 查不到就照常推送：宁可重复一次，也不能让用户的查询石沉大海
                  print(f"::warning::重复查询守卫查询失败，照常推送：{type(exc).__name__} {exc}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: 检出仓库
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 准备 Python
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      # akshare 自动带 pandas/numpy/requests；PyYAML 是 utils.db_config 读 database.yaml 用的；
      # matplotlib 用于把结论画成图片卡片（不装 mplfinance，K 线自己手绘）。
      - name: 安装依赖
        if: steps.dedupe.outputs.skip != 'true'
        run: python -m pip install -q "akshare==1.20.42" "PyYAML>=6.0,<7" "matplotlib>=3.7,<4"

      # 中文字体：runner 默认没有 CJK 字库，缺了会画成方块（代码里检测不到字体就自动退回文本）
      - name: 安装中文字体
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          if fc-list :lang=zh >/dev/null 2>&1 && [ -n "$(fc-list :lang=zh)" ]; then
            echo "已有中文字体，跳过安装"
          else
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq fonts-noto-cjk || echo "::warning::中文字体安装失败，本次将退回纯文本推送"
          fi
          fc-list :lang=zh | head -3 || true

      - name: 分析并推送飞书
        if: steps.dedupe.outputs.skip != 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # 群里发代码触发时，Worker 会把 chat_id 传下来 → 结果回到那个群
          # 群里触发时由 Worker 带入；网页手动跑时可留空，改用仓库变量 FEISHU_CHAT_ID（设一次即可）
          FEISHU_CHAT_ID: ${{ inputs.chat_id || vars.FEISHU_CHAT_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          STOCK_CODES: ${{ inputs.stocks }}
          PERIOD: ${{ inputs.period }}
          CARD_DIR: reports/cards
          # 决策仪表盘文字摘要：优先 Cloudflare Workers AI（免密钥），
          # 失败自动降级 DeepSeek，再失败用本地模板。都不配也能正常出卡片。
          AI_SUMMARY_URL: ${{ secrets.AI_SUMMARY_URL }}
          AI_SUMMARY_TOKEN: ${{ secrets.AI_SUMMARY_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python stock_query.py

      # 图片留在运行页，方便核对「群里看到的那张图」到底长什么样
      - name: 保存图片产物
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stock-cards
          path: reports/cards/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败告警
        if: failure()
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 个股查询任务运行失败，请查看日志"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        uses: ./.github/actions/alert
        with:
          message: "⚠️ 个股查询 job 被取消或超时（failure() 告警不会触发）"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
