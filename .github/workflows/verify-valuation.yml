name: 验证 · 真实估值取数 (PE/PB/PS/市值)

# 在 GitHub Actions runner（独立出口 IP，不受本地东财 push2 限流影响）上
# 真实跑一遍 stock_analyzer.real_fundamentals.get_real_valuation，
# 确认 PE/PB/PS/总市值 能正常取到真实值。
# 仅手动触发，不随 push/PR 自动运行。
on:
  workflow_dispatch:
    inputs:
      stocks:
        description: '待验证股票代码，逗号分隔（6 位）'
        required: false
        default: '600519,000001,300750'
        type: string

permissions:
  contents: read

concurrency:
  group: verify-valuation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install -q "akshare==1.20.42"

      - name: 真实估值取数验证
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.')
          from stock_analyzer import real_fundamentals as rf

          codes = [c.strip() for c in "${{ inputs.stocks }}".split(',') if c.strip()]
          all_ok = True
          for code in codes:
              val = rf.get_real_valuation(code)
              has_pe = val.get('pe') is not None
              has_ps = val.get('ps') is not None
              has_pb = val.get('pb') is not None
              has_mc = val.get('market_cap') is not None
              status = 'OK' if (has_pe and has_ps and has_pb and has_mc) else 'PARTIAL/EMPTY'
              if not (has_pe and has_ps):
                  all_ok = False
              print(f"[{status}] {code}: {json.dumps(val, ensure_ascii=False, default=str)}")
          print("RESULT:", "ALL_REAL_PE_PS" if all_ok else "PE_OR_PS_MISSING")
          PY
