name: 验证 · 真实数据取数 (估值/资金流/行情)

# 在 GitHub Actions runner（数据中心 IP）上真实跑一遍数据取数，确认
# 估值(PE/PB/PS/市值)、资金流、行情、个股名称/行业(datacenter IP 下东财 push2
# 会被拦截，需由百度/同花顺/新浪/巨潮兜底)均能取到真实值，且长周期行情足以
# 计算 MA200（技术趋势不再退化）。仅手动触发，不随 push/PR 自动运行。
on:
  workflow_dispatch:
    inputs:
      stocks:
        description: '待验证股票代码，逗号分隔（6 位）'
        required: false
        default: '600519,000001,300750'
        type: string

permissions:
  contents: read

concurrency:
  group: verify-valuation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install -q "akshare==1.20.42" "PyYAML>=6.0,<7"

      - name: 真实估值取数验证
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.')
          from stock_analyzer import real_fundamentals as rf

          codes = [c.strip() for c in "${{ inputs.stocks }}".split(',') if c.strip()]
          all_ok = True
          for code in codes:
              val = rf.get_real_valuation(code)
              has_pe = val.get('pe') is not None
              has_ps = val.get('ps') is not None
              has_pb = val.get('pb') is not None
              has_mc = val.get('market_cap') is not None
              status = 'OK' if (has_pe and has_ps and has_pb and has_mc) else 'PARTIAL/EMPTY'
              if not (has_pe and has_ps):
                  all_ok = False
              print(f"[{status}] {code}: {json.dumps(val, ensure_ascii=False, default=str)}")
          print("RESULT:", "ALL_REAL_PE_PS" if all_ok else "PE_OR_PS_MISSING")
          PY

      - name: 资金流 + 行情兜底验证
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.')
          from stock_analyzer.data_fetcher import DataFetcher

          # 跳过 __init__（避免 DB/yaml 等与本检查无关的初始化依赖），
          # get_fund_flow / get_stock_quote 不依赖 db_manager/session。
          f = object.__new__(DataFetcher)
          codes = [c.strip() for c in "${{ inputs.stocks }}".split(',') if c.strip()]
          ff_ok = 0
          q_ok = 0
          for code in codes:
              ff = f.get_fund_flow(code)
              q = f.get_stock_quote(code, "60d")
              if ff.get("main_inflow"):
                  ff_ok += 1
              rows = 0 if q is None else len(q)
              if rows > 0:
                  q_ok += 1
              print(f"[FF] {code}: {json.dumps(ff, ensure_ascii=False, default=str)}")
              print(f"[Q ] {code}: rows={rows}")
          print("RESULT_FF:", f"{ff_ok}/{len(codes)} 有资金流")
          print("RESULT_Q :", f"{q_ok}/{len(codes)} 有行情")
          PY

      - name: 基础信息(名称/行业) + 长周期行情(MA200) 验证
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.')
          from stock_analyzer.data_fetcher import DataFetcher
          from stock_analyzer.technical_analyzer import TechnicalAnalyzer

          # 数据中心 IP 下东财 push2 已不可用，这里验证名称/行业能由巨潮兜底补齐，
          # 且 400 自然日行情足以算出 MA200、趋势不再退化为「未知」。
          f = object.__new__(DataFetcher)
          f.DEFAULT_STOCK_LIST = {}
          codes = [c.strip() for c in "${{ inputs.stocks }}".split(',') if c.strip()]
          info_ok = bars_ok = trend_ok = 0
          for code in codes:
              b = f.get_stock_basic(code)
              q = f.get_stock_quote(code, '400d')
              bars = 0 if q is None else len(q)
              trend = TechnicalAnalyzer().analyze_trend(q).get('trend', '未知') if bars else '未知'
              if b.get('name') and b['name'] != code and b.get('industry') not in ('', '未知行业'):
                  info_ok += 1
              if bars >= 200:
                  bars_ok += 1
              if trend and trend != '未知':
                  trend_ok += 1
              print(f"[INFO] {code}: {json.dumps(b, ensure_ascii=False)}")
              print(f"[HIST] {code}: bars={bars} trend={trend}")
          print("RESULT_INFO :", f"{info_ok}/{len(codes)} 名称行业齐全")
          print("RESULT_MA200:", f"{bars_ok}/{len(codes)} 行情≥200根")
          print("RESULT_TREND:", f"{trend_ok}/{len(codes)} 趋势已判定")
          PY

      - name: 技术指标真实值(MACD/KDJ/BOLL/RSI) 验证
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.')
          from stock_analyzer import StockAnalyzer
          from stock_analyzer.data_fetcher import DataFetcher
          from stock_analyzer.technical_analyzer import TechnicalAnalyzer

          # 验证 MACD/KDJ/布林带/RSI 是真实计算值，而非由趋势强度反推
          f = object.__new__(DataFetcher)
          f.DEFAULT_STOCK_LIST = {}
          sa = object.__new__(StockAnalyzer)
          codes = [c.strip() for c in "${{ inputs.stocks }}".split(',') if c.strip()]
          ok = 0
          for code in codes:
              q = f.get_stock_quote(code, '400d')
              raw = TechnicalAnalyzer().comprehensive_technical_analysis(q)
              tech = StockAnalyzer._convert_technical_result(sa, raw)
              ind = tech['indicators']
              detail = tech.get('indicator_detail', {})
              good = (ind['MACD'] in ('金叉', '死叉', '多头', '空头')
                      and ind['KDJ'] in ('超买', '超卖', '金叉', '死叉', '中性')
                      and ind['Bollinger'] in ('突破上轨', '突破下轨', '通道内')
                      and isinstance(ind['RSI'], float) and detail.get('macd', {}).get('dif') is not None)
              ok += 1 if good else 0
              print(f"[IND] {code}: {json.dumps(ind, ensure_ascii=False)} "
                    f"detail={json.dumps(detail, ensure_ascii=False)} ok={good}")
          print("RESULT_IND :", f"{ok}/{len(codes)} 指标为真实计算值")
          PY

      # 2026-11-14 修复专项：三处「云端必然踩到」的问题在 runner 上一次性验完
      - name: 配置路径 / 板块数据 / 市值口径 验证
        run: |
          python - <<'PY'
          import glob, json, re, sys
          sys.path.insert(0, '.')

          # 1) 配置路径：旧实现写死 /root/quant-csv，runner 上导入即 PermissionError
          import importlib
          import os
          os.environ['STRATEGY_PARAMS_PATH'] = '/root/quant-csv/config/strategy_params.yaml'
          import strategy.pattern_config as pc
          pc = importlib.reload(pc)
          ok_cfg = isinstance(pc._yaml_config, dict) and len(pc.B1_PERFECT_CASES) > 0
          print(f"[CFG] 受限路径导入={'OK' if ok_cfg else 'FAIL'} cases={len(pc.B1_PERFECT_CASES)}")

          # 2) 板块数据：概念板块必须有数据，且消息里不能出现「数据源不可用」
          import sector_data as sd
          inds = sd.get_industry_sectors()
          cons = sd.get_concept_sectors()
          msg = sd.format_sector_message()
          ok_ind = len(inds) > 0
          ok_con = len(cons) > 0 and '数据源暂不可用' not in msg
          print(f"[BOARD] 行业={len(inds)} 概念={len(cons)} 显式报缺={'是' if '数据源暂不可用' in msg else '否'}")
          if cons:
              print('[BOARD] 概念领涨:', [f"{c['name']}{c['pct']:+.2f}%" for c in cons[:3]],
                    '| 领跌:', [f"{c['name']}{c['pct']:+.2f}%" for c in cons[-3:]])
          print("RESULT_BOARD:", f"行业{'OK' if ok_ind else 'FAIL'} 概念{'OK' if ok_con else 'FAIL'}")

          # 3) 市值：腾讯批量源（新主源）必须给出「元」量级真值
          from utils.stock_data_fetcher import StockDataFetcher
          sdf = object.__new__(StockDataFetcher)
          codes = [c.strip() for c in "${{ inputs.stocks }}".split(',') if c.strip()]
          caps = sdf._fetch_market_cap_tencent(codes)
          ok_cap = len(caps) == len(codes) and all(v > 1e9 for v in caps.values())
          print("[CAP] " + json.dumps({k: f'{v/1e8:.2f}亿' for k, v in caps.items()}, ensure_ascii=False))
          print("RESULT_CAP:", f"{len(caps)}/{len(codes)} 有市值（元）" + (" OK" if ok_cap else " 单位可疑"))

          # 4) 假市值兜底必须清干净：策略代码里不得再出现未注释的 2e8
          hits = []
          for path in sorted(glob.glob('strategy/*.py')):
              for lineno, line in enumerate(open(path, encoding='utf-8'), 1):
                  code = line.split('#', 1)[0]
                  if '2e8' in code:
                      hits.append(f'{path}:{lineno}')
          print("RESULT_FAKECAP:", "CLEAN" if not hits else f"LEFT {hits}")
          PY
