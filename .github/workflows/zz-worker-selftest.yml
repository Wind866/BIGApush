name: ZZ Worker Selftest (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Worker endpoints from GitHub runner
        run: |
          echo "=== /health ==="
          curl -sS --max-time 25 -w "\nHTTP %{http_code}\n" \
            "https://gh-actions-scheduler.322838610.workers.dev/health" || echo "HEALTH_CURL_FAILED"
          echo "=== /test?at=01:00 ==="
          curl -sS --max-time 45 -w "\nHTTP %{http_code}\n" \
            "https://gh-actions-scheduler.322838610.workers.dev/test?at=01:00" || echo "TEST_CURL_FAILED"
