name = "gh-actions-scheduler"
main = "worker.js"
compatibility_date = "2026-11-14"

# 只用一个 cron，占掉免费账号 5 个额度里的 1 个。
# Worker 每分钟唤醒一次，内部按北京时间查表命中 9 个档期；未命中的分钟零网络请求。
# 部署前请先删掉旧 Worker biga-push-cron 的 cron（13 14 * * *），否则晚间新闻会触发两次。
[triggers]
crons = ["* * * * *"]

[vars]
OWNER = "Wind866"
BRANCH = "main"

# 以下两项是 Secret，不要写进本文件：
#   npx wrangler secret put GH_TOKEN       # fine-grained PAT，勾 3 个仓库的 Actions: Read and write
#   npx wrangler secret put ALERT_WEBHOOK  # 独立的飞书告警机器人 webhook
