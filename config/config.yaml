# ============================================
# A股量化选股系统 - 主配置文件
# ============================================
# 说明：此文件由 config.yaml.template 生成
# 不要提交此文件到Git仓库（已加入.gitignore）

data_dir: data


# 飞书机器人配置
# ⚠️ 安全提示：请勿在此填写真实 webhook。公开仓库中的任何内容都会被爬虫抓取，
#    拿到 webhook 的人可向你的群随意发消息。请改用环境变量 / GitHub Secrets：
#      FEISHU_WEBHOOK=https://open.feishu.cn/open-apis/bot/v2/hook/xxxxx
#    本文件保留空值，main.py 会优先读取环境变量。
#    若曾经提交过真实 webhook，请务必到飞书群「设置 → 群机器人」重置该机器人。
feishu:
  webhook_url: ""

# 定时任务配置（仅本地 schedule 模式参考；GitHub Actions 以 workflow cron 为准）
schedule:
  time: "15:43"  # 收盘选股时间（北京时间，与 .github/workflows/selection.yml 的 cron 保持一致）

# 数据更新配置
update:
  lookback_days: 10
  skip_failed: true

# 股票过滤配置
filters:
  # 最小市值（亿元）
  min_market_cap: 40
  # 最大市值（亿元）
  max_market_cap: 5000
  # 最小流通股本（亿股）
  min_float_shares: 1
  # 最大流通股本（亿股）
  max_float_shares: 100
  # 排除新股（上市天数）
  exclude_new_stock_days: 60
  # 排除ST股票
  exclude_st: true
  # 排除退市风险股票
  exclude_delisting_risk: true

# 交易配置
trading:
  # 初始资金（元）
  initial_capital: 300000.0
